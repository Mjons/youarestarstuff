<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lost in space · You Are Star Stuff</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#060822" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #e9ecff;
        --dim: #aab2ea;
        --gold: #ffcc3d;
        --pink: #ff7f96;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #060822;
        color: var(--ink);
        font:
          500 17px/1.5 Inter,
          system-ui,
          sans-serif;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      main {
        position: relative;
        z-index: 1;
        height: 100%;
        display: grid;
        align-content: center;
        padding: 0 max(16px, 7vw);
        pointer-events: none;
      }
      .copy {
        max-width: 520px;
        pointer-events: auto;
      }
      .code {
        font:
          400 15px Anton,
          Impact,
          sans-serif;
        letter-spacing: 0.3em;
        color: var(--gold);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .code i {
        width: 12px;
        height: 12px;
        background: var(--gold);
        clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0 50%);
      }
      h1 {
        font:
          400 clamp(56px, 11vw, 132px)/0.92 Anton,
          Impact,
          "Arial Black",
          sans-serif;
        margin: 14px 0 18px;
        letter-spacing: 0.01em;
      }
      h1 span {
        color: var(--gold);
        display: block;
      }
      p {
        margin: 0 0 26px;
        color: #dfe3ff;
        font-size: clamp(16px, 1.6vw, 19px);
        max-width: 30em;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a.btn {
        display: inline-block;
        font:
          700 15px Inter,
          system-ui,
          sans-serif;
        text-decoration: none;
        padding: 13px 22px;
        border-radius: 999px;
        border: 1.5px solid rgba(214, 220, 255, 0.35);
        color: var(--ink);
      }
      a.btn.gold {
        background: var(--gold);
        color: #1b1f3b;
        border-color: var(--gold);
      }
      a.btn:hover {
        border-color: var(--gold);
      }
      a.btn:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      .hint {
        position: fixed;
        z-index: 1;
        right: 16px;
        bottom: 14px;
        font:
          500 12px Inter,
          sans-serif;
        color: rgba(170, 178, 234, 0.7);
        letter-spacing: 0.06em;
      }
      @media (max-width: 760px) {
        main {
          align-content: start;
          padding-top: 9vh;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="cv" aria-hidden="true"></canvas>
    <main>
      <div class="copy">
        <div class="code"><i></i>ERROR 404</div>
        <h1>LOST IN<span>SPACE</span></h1>
        <p>
          This page drifted off into a cosmic void. Stew grabbed his lantern and
          went looking for it. While he searches, the rest of the universe is
          right this way.
        </p>
        <div class="btns">
          <a class="btn gold" href="/">Take me home</a
          ><a
            class="btn"
            href="https://www.youtube.com/@YouAreStarStuff/videos"
            rel="noopener"
            >Watch the series</a
          >
        </div>
      </div>
    </main>
    <div class="hint" id="hint">Move your cursor. Stew is watching.</div>
    <script>
      // ===== You Are Star Stuff · Cosmic Year 2027 · shared kit (Hex Remix grammar) =====
      // Logical frame: LW x LH = 1350 x 1050 (11.25 x 8.75 in incl. bleed). Export scales it to 3375 x 2625.
      // Every page is a pure function of (t, seed). Light always from the top left.
      const TAU = Math.PI * 2,
        H30 = Math.PI / 6,
        LW = 1350,
        LH = 1050;
      const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
      const lerp = (a, b, t) => a + (b - a) * t;
      const ss = (a, b, x) => {
        const t = clamp((x - a) / (b - a));
        return t * t * (3 - 2 * t);
      };
      const eo = (t) => 1 - Math.pow(1 - t, 3);
      const ei = (t) => t * t * t;
      function rng(seed) {
        return () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const hexc = (h) => [
        parseInt(h.slice(1, 3), 16),
        parseInt(h.slice(3, 5), 16),
        parseInt(h.slice(5, 7), 16),
      ];
      const rgba = (h, a) => {
        const c = hexc(h);
        return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
      };
      const mixc = (a, b, t) => {
        const A = hexc(a),
          B = hexc(b);
        return (
          "#" +
          A.map((v, i) =>
            Math.round(lerp(v, B[i], t))
              .toString(16)
              .padStart(2, "0"),
          ).join("")
        );
      };
      const hash = (i, j) => {
        const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453;
        return s - Math.floor(s);
      };
      function circle(ctx, x, y, r, fill) {
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0, r), 0, TAU);
        ctx.fillStyle = fill;
        ctx.fill();
      }
      // soft glow: ONLY for light sources (stars, hot cores, antenna, your atom)
      function glow(ctx, x, y, r, col, a) {
        if (a <= 0 || r <= 0) return;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(col, a));
        g.addColorStop(0.35, rgba(col, a * 0.45));
        g.addColorStop(1, rgba(col, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fill();
      }
      function addGlow(ctx, x, y, r, col, a) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        glow(ctx, x, y, r, col, a);
        ctx.restore();
      }

      // ---------- palette library (from the series renderers) ----------
      const C = {
        sp0: "#1d2266",
        sp1: "#11154a",
        sp2: "#060822",
        vig: "#040519",
        ink: "#1b1f3b",
        white: "#ffffff",
        warm: "#ffd9a8",
        cool: "#a8e6ff",
        pink: "#ff5c8a",
        gold: "#ffcc3d",
        teal: "#3fe0d0",
        violet: "#8a6bff",
        orange: "#ff8a3d",
        sky: "#5ad1ff",
        magenta: "#ff6fd8",
        nebPink: "#ff4f9a",
        nebViolet: "#7a3cff",
        nebCyan: "#22d3ee",
        nebMint: "#3ef0c0",
        nebOrange: "#ff7a45",
        nebPurple: "#b14dff",
        nebGold: "#ffcf3f",
        life: [
          "#2f9f57",
          "#38b062",
          "#4cc472",
          "#5fd37f",
          "#7ee07d",
          "#9be98f",
        ],
        neonCyan: "#7ff3ff",
        neonMagenta: "#ff6fd8",
        stew: {
          body: "#ff7f96",
          shade: "#e55c78",
          legs: "#d9576e",
          belly: "#ffa6b6",
          antGlow: "#ffe27a",
          spark: "#fff2a0",
        },
      };
      // stepped ramps, outer -> core
      const RAMP = {
        young: [
          "#ff7a1c",
          "#ff9a26",
          "#ffb733",
          "#ffd24d",
          "#ffe98a",
          "#fff7d6",
        ],
        giant: [
          "#b8233f",
          "#d8333f",
          "#ee4f3f",
          "#ff6e46",
          "#ff965a",
          "#ffc58a",
        ],
        blue: [
          "#3f66f0",
          "#5a86ff",
          "#7fa6ff",
          "#a8c4ff",
          "#d6e4ff",
          "#ffffff",
        ],
        gold: [
          "#ff9a26",
          "#ffb733",
          "#ffcc3d",
          "#ffd24d",
          "#ffe98a",
          "#fff7d6",
        ],
        plat: ["#7d88ad", "#a3add0", "#c9d1ec", "#e6ecff", "#ffffff"],
        plasma: ["#c2255c", "#ff5e5b", "#ff8a3d", "#ffb347", "#ffd166"],
        ocean: ["#0b3b7a", "#11589e", "#1b8fd6", "#27a7e6", "#3bbcf0"],
      };

      // ---------- Hex Remix primitives ----------
      // polyPath: rounded regular polygon. sx/sy squash for tilted planes.
      function polyPath(ctx, x, y, r, rot = 0, n = 6, rnd = 0, sx = 1, sy = 1) {
        const p = [];
        for (let i = 0; i < n; i++) {
          const a = rot + (i * TAU) / n;
          p.push([x + Math.cos(a) * r * sx, y + Math.sin(a) * r * sy]);
        }
        ctx.beginPath();
        if (!rnd) {
          p.forEach((q, i) =>
            i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]),
          );
          ctx.closePath();
          return;
        }
        const m = [(p[n - 1][0] + p[0][0]) / 2, (p[n - 1][1] + p[0][1]) / 2];
        ctx.moveTo(m[0], m[1]);
        for (let i = 0; i < n; i++) {
          const a = p[i],
            b = p[(i + 1) % n];
          ctx.arcTo(a[0], a[1], b[0], b[1], r * rnd * Math.min(sx, sy));
        }
        ctx.closePath();
      }
      function hexF(ctx, x, y, r, rot, fill, rnd = 0.14) {
        if (r <= 0) return;
        polyPath(ctx, x, y, r, rot, 6, rnd);
        ctx.fillStyle = fill;
        ctx.fill();
      }
      function hexS(ctx, x, y, r, rot, stroke, lw, rnd = 0.14) {
        if (r <= 0) return;
        polyPath(ctx, x, y, r, rot, 6, rnd);
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lw;
        ctx.stroke();
      }
      // 6-point Hex Remix sparkle (the 4-point star is reserved for the cover logo: use sparkle4)
      function sparkle(ctx, x, y, s, col, a = 1) {
        ctx.save();
        ctx.globalAlpha *= a;
        ctx.fillStyle = col;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a1 = -Math.PI / 2 + (i * TAU) / 6,
            a2 = a1 + TAU / 12;
          const X = x + Math.cos(a1) * s,
            Y = y + Math.sin(a1) * s;
          i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
          ctx.lineTo(x + Math.cos(a2) * s * 0.28, y + Math.sin(a2) * s * 0.28);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      function sparkle4(ctx, x, y, s, col, a = 1) {
        ctx.save();
        ctx.globalAlpha *= a;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(x, y - s);
        ctx.quadraticCurveTo(x, y, x + s, y);
        ctx.quadraticCurveTo(x, y, x, y + s);
        ctx.quadraticCurveTo(x, y, x - s, y);
        ctx.quadraticCurveTo(x, y, x, y - s);
        ctx.fill();
        ctx.restore();
      }
      // isometric cube = hexagon split into three rhombi (nucleons, crystals, blocks)
      function cube(ctx, x, y, r, top, right, left, edge = true) {
        const v = (i) => [
          x + Math.cos(-Math.PI / 2 + (i * TAU) / 6) * r,
          y + Math.sin(-Math.PI / 2 + (i * TAU) / 6) * r,
        ];
        const face = (pts, c) => {
          ctx.beginPath();
          ctx.moveTo(x, y);
          pts.forEach((i) => ctx.lineTo(...v(i)));
          ctx.closePath();
          ctx.fillStyle = c;
          ctx.fill();
        };
        face([5, 0, 1], top);
        face([1, 2, 3], right);
        face([3, 4, 5], left);
        if (edge) {
          ctx.strokeStyle = "rgba(255,255,255,.55)";
          ctx.lineWidth = r * 0.07;
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(...v(5));
          ctx.lineTo(...v(0));
          ctx.lineTo(...v(1));
          ctx.stroke();
        }
      }
      // pointy-top axial hex grid covering a disc
      function hexGrid(cell, cx, cy, rad, fn) {
        const w = Math.sqrt(3) * cell,
          h = 1.5 * cell,
          rows = Math.ceil(rad / h) + 1,
          cols = Math.ceil(rad / w) + 1;
        for (let j = -rows; j <= rows; j++)
          for (let i = -cols; i <= cols; i++) {
            const x = cx + (i + (j & 1) * 0.5) * w,
              y = cy + j * h;
            if (Math.hypot(x - cx, y - cy) > rad + cell) continue;
            fn(x, y, i, j);
          }
      }
      // hex grid filling a rectangle
      function hexGridRect(cell, x0, y0, x1, y1, fn) {
        const w = Math.sqrt(3) * cell,
          h = 1.5 * cell;
        for (let j = Math.floor(y0 / h) - 1; j <= Math.ceil(y1 / h) + 1; j++)
          for (
            let i = Math.floor(x0 / w) - 1;
            i <= Math.ceil(x1 / w) + 1;
            i++
          ) {
            const x = (i + (j & 1) * 0.5) * w,
              y = j * h;
            fn(x, y, i, j);
          }
      }
      // stepped concentric hex plates (use instead of an airbrushed radial gradient). steps: [[r, col, alpha], ...] outer -> inner
      function steppedPlates(
        ctx,
        x,
        y,
        steps,
        rot = 0,
        sx = 1,
        sy = 1,
        additive = true,
        rnd = 0.12,
      ) {
        ctx.save();
        if (additive) ctx.globalCompositeOperation = "lighter";
        steps.forEach(([R, col, a], i) => {
          ctx.globalAlpha = a;
          polyPath(ctx, x, y, R, rot + (i % 2) * H30, 6, rnd, sx, sy);
          ctx.fillStyle = col;
          ctx.fill();
        });
        ctx.restore();
      }
      // flat sphere: base, shade crescent bottom-right, highlight dot top-left
      function ball(ctx, x, y, r, base, dark, hi = "rgba(255,255,255,.75)") {
        circle(ctx, x, y, r, base);
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.clip();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.arc(x - r * 0.28, y - r * 0.28, r * 1.02, 0, TAU, true);
        ctx.fillStyle = dark;
        ctx.fill("evenodd");
        ctx.restore();
        if (hi) circle(ctx, x - r * 0.38, y - r * 0.4, r * 0.16, hi);
      }
      // double stroke line (warm thick under pale thin core) for jets, orbits, prominences, trails
      function dbl(ctx, pts, wide, core, w = 3, alpha = 1, closed = false) {
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (const [col, lw, a] of [
          [wide, w, 0.45 * alpha],
          [core, w * 0.35, 0.9 * alpha],
        ]) {
          ctx.strokeStyle = rgba(col, a);
          ctx.lineWidth = lw;
          ctx.beginPath();
          pts.forEach((p, i) =>
            i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]),
          );
          if (closed) ctx.closePath();
          ctx.stroke();
        }
        ctx.restore();
      }

      // ---------- big subjects ----------
      // faceted hex-gem star with honeycomb convection, stepped rings, corona spikes, angular prominences.
      // o: { ramp (outer->core, 6 cols), halo col, spin, cells (bool), prom (count), white (0..1) }
      function hexStar(ctx, x, y, R, t, o = {}) {
        const ramp = o.ramp || RAMP.young,
          halo = o.halo || ramp[1],
          spin = (o.spin ?? 0) + t * 0.04,
          white = o.white || 0;
        ctx.save();
        ctx.translate(x, y);
        ctx.globalCompositeOperation = "lighter";
        const hg = ctx.createRadialGradient(
          0,
          0,
          R * 0.8,
          0,
          0,
          R * (o.haloR || 2.4),
        );
        hg.addColorStop(0, rgba(halo, 0.5));
        hg.addColorStop(0.35, rgba(halo, 0.14));
        hg.addColorStop(1, rgba(halo, 0));
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.arc(0, 0, R * (o.haloR || 2.4), 0, TAU);
        ctx.fill();
        if (o.spikes !== false)
          for (let i = 0; i < 12; i++) {
            const a = spin + (i * TAU) / 12,
              L = R * (i % 2 ? 1.3 : 1.62) * (1 + 0.07 * Math.sin(t * 1.5 + i)),
              w = i % 2 ? 0.05 : 0.085;
            const rg = ctx.createRadialGradient(0, 0, R * 0.85, 0, 0, L);
            rg.addColorStop(0, rgba(halo, 0.3));
            rg.addColorStop(1, rgba(halo, 0));
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a - w) * R * 0.85, Math.sin(a - w) * R * 0.85);
            ctx.lineTo(Math.cos(a) * L, Math.sin(a) * L);
            ctx.lineTo(Math.cos(a + w) * R * 0.85, Math.sin(a + w) * R * 0.85);
            ctx.fill();
          }
        ctx.globalCompositeOperation = "source-over";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        const np = o.prom ?? 4;
        for (let k = 0; k < np; k++) {
          const h =
              (0.1 + 0.08 * hash(k, 3)) * (0.8 + 0.2 * Math.sin(t * 1.6 + k)),
            a = spin + (k * TAU) / np + 0.4 + hash(k, 9),
            sp = 0.12;
          const pts = [
            [a - sp, 0.95],
            [a - sp * 0.6, 1 + h * 1.2],
            [a + sp * 0.6, 1 + h * 1.2],
            [a + sp, 0.95],
          ].map(([pa, pr]) => [Math.cos(pa) * R * pr, Math.sin(pa) * R * pr]);
          for (const [w, c] of [
            [0.03, ramp[3]],
            [0.011, ramp[5]],
          ]) {
            ctx.strokeStyle = c;
            ctx.lineWidth = R * w;
            ctx.beginPath();
            pts.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p)));
            ctx.stroke();
          }
        }
        const RR = [1, 0.9, 0.78, 0.63, 0.46, 0.27];
        for (let i = 0; i < 6; i++) {
          let c = ramp[i];
          if (white > 0) c = mixc(c, "#ffffff", white * (0.4 + i * 0.12));
          hexF(
            ctx,
            0,
            0,
            R * (i === 0 ? 1 : RR[i] * 1.04),
            spin * (i % 2 ? -1.6 : 1) + (i % 2) * H30,
            c,
            i === 0 ? 0.1 : 0.16,
          );
        }
        ctx.save();
        polyPath(ctx, 0, 0, R * 0.99, spin, 6, 0.1);
        ctx.clip();
        for (let k = 0; k < 6; k++) {
          const a1 = spin + (k * TAU) / 6,
            a2 = a1 + TAU / 6;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a1) * R * 1.1, Math.sin(a1) * R * 1.1);
          ctx.lineTo(Math.cos(a2) * R * 1.1, Math.sin(a2) * R * 1.1);
          ctx.closePath();
          ctx.fillStyle = [
            "rgba(255,255,230,.10)",
            "rgba(255,240,200,.04)",
            "rgba(150,30,0,.05)",
            "rgba(120,10,20,.12)",
            "rgba(150,30,0,.07)",
            "rgba(255,250,230,.06)",
          ][k];
          ctx.fill();
        }
        if (o.cells !== false) {
          const cell = R * 0.072;
          hexGrid(cell, 0, 0, R, (cx, cy, i, j) => {
            const h = hash(i, j),
              d = Math.hypot(cx, cy) / R,
              pulse = 0.5 + 0.5 * Math.sin(t * (1.2 + h * 2) + h * 9);
            if (h < 0.55) return;
            ctx.fillStyle =
              h > 0.8
                ? `rgba(255,250,215,${0.1 + 0.12 * pulse})`
                : rgba(o.cellDark || "#c84600", 0.07 + 0.08 * pulse);
            polyPath(ctx, cx, cy, cell * (0.82 - d * 0.2), H30, 6, 0.15);
            ctx.fill();
          });
        }
        ctx.restore();
        ctx.lineWidth = R * 0.03;
        ctx.strokeStyle = "rgba(255,255,240,.32)";
        ctx.beginPath();
        for (let k = 3; k <= 5; k++) {
          const a = spin + (k * TAU) / 6;
          const X = Math.cos(a) * R * 0.93,
            Y = Math.sin(a) * R * 0.93;
          k === 3 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
        }
        ctx.stroke();
        ctx.globalCompositeOperation = "lighter";
        glow(ctx, 0, 0, R * 0.5, "#fff3c0", 0.18 + white * 0.7);
        ctx.restore();
      }
      // hex-tile world (planet / moon). o: { tile(u,v,h,i,j) -> fill colour or null, base, cell (fraction of R), shade, rim, atmo }
      function hexWorld(ctx, x, y, R, t, o = {}) {
        ctx.save();
        if (o.atmo) addGlow(ctx, x, y, R * 1.35, o.atmo, 0.4);
        ctx.beginPath();
        ctx.arc(x, y, R, 0, TAU);
        ctx.save();
        ctx.clip();
        circle(ctx, x, y, R, o.base || "#1b8fd6");
        const cell = R * (o.cell || 0.075);
        hexGrid(cell, x, y, R, (hx, hy, i, j) => {

            0,
            W * 0.7,
            H * 0.45,
            Math.max(W, H) * 0.9,
          );
          g.addColorStop(0, "#1d2266");
          g.addColorStop(0.5, "#11154a");
          g.addColorStop(1, "#060822");
          x.fillStyle = g;
          x.fillRect(0, 0, W, H);
          // parallax star layers
          const px = mx - 0.5,
            py = my - 0.5;
          stars.forEach((L, i) => {
            x.save();
            x.translate(-px * (6 + i * 10), -py * (4 + i * 8));
            drawStars(x, [L], t);
            x.restore();
          });
          drawPlates(x, plates, t);
          const S = Math.max(0.7, Math.min(W, H * 1.2) / 900); // scene scale
          const wide = W > 760,
            vx = W * (wide ? 0.74 : 0.7),
            vy = H * (wide ? 0.36 : 0.74);
          voidHex(vx + px * -20, vy + py * -14, 90 * S, t);
          // the page tumbling toward the void on a slow loop
          const k = (t * 0.06) % 1,
            ang = k * TAU * 0.9 + 2.2,
            dd = 260 * S * (1 - k * 0.75);
          x.globalAlpha = Math.min(1, (1 - k) * 4);
          lostPage(
            vx + Math.cos(ang) * dd * 1.2,
            vy + Math.sin(ang) * dd * 0.7,
            t,
          );
          x.globalAlpha = 1;
          // drifting dust
          for (const d of dust) {
            const yy = ((d.y + t * 12 * d.v) % (H + 20)) - 10;
            x.globalAlpha = 0.4;
            hexF(
              x,
              d.x + Math.sin(t * 0.5 + d.ph) * 8,
              yy,
              d.s,
              d.ph,
              "#aab2ea",
              0.2,
            );
          }
          x.globalAlpha = 1;
          // Stew: floating, tethered to a tiny hex asteroid, lantern raised toward the void, eyes follow the cursor
          const sx = vx - (wide ? 230 : 150) * S + px * 18,
            sy = vy + 150 * S + Math.sin(t * 1.3) * 10 * S + py * 12;
          const ax = sx - (wide ? 130 : 60) * S,
            ay = sy + (wide ? 150 : 120) * S;
          // asteroid
          hexF(x, ax + 4, ay + 6, 34 * S, 0.3, "rgba(4,5,25,.5)", 0.2);
          ["#2a2f78", "#3a418f", "#4b52a6"].forEach((c, i) =>
            hexF(
              x,
              ax - i * 2 * S,
              ay - i * 2.4 * S,
              34 * S * (1 - i * 0.22),
              0.3,
              c,
              0.2,
            ),
          );
          // tether
          x.strokeStyle = "rgba(255,204,61,.75)";
          x.lineWidth = 2 * S;
          x.setLineDash([6 * S, 6 * S]);
          x.beginPath();
          x.moveTo(ax + 10 * S, ay - 18 * S);
          x.quadraticCurveTo(
            ax + 40 * S,
            sy + 80 * S + Math.sin(t) * 10,
            sx - 8 * S,
            sy - 10 * S,
          );
          x.stroke();
          x.setLineDash([]);
          // lantern glow
          const lx = sx + (26 * S * 3.2) / 3.2 + 40 * S,
            ly = sy - 112 * S;
          addGlow(x, lx, ly, 120 * S, "#ffd76a", 0.35 + 0.05 * Math.sin(t * 7));
          x.save();
          x.translate(sx, sy);
          x.rotate(Math.sin(t * 0.8) * 0.06);
          const sc = (wide ? 4 : 3.4) * S;
          x.scale(sc, sc);
          const dxl = (mx * W - sx) / W,
            dyl = (my * H - sy) / H,
            n = Math.hypot(dxl, dyl) || 1;
          stewBody(x, t, {
            look: [dxl / n, dyl / n],
            mouth: "o",
            arms: "none",
            shadow: false,
            legs: true,
          });
          stewArm(x, -9, -17, -14, -12, -15, -7, true);
          stewArm(x, 9, -17, 15, -24, 18, -31, true);
          x.restore();
          // lantern (in world space, at Stew's raised hand)
          const hx = sx + 18 * sc,
            hy = sy - 31 * sc;
          x.strokeStyle = "#c9cff5";
          x.lineWidth = 1.6 * S;
          x.beginPath();
          x.moveTo(hx, hy);
          x.lineTo(hx, hy - 10 * S);
          x.stroke();
          hexF(x, hx, hy - 24 * S, 14 * S, 0, "#7a5a1a", 0.2);
          hexF(x, hx, hy - 24 * S, 11 * S, 0, "#ffd76a", 0.2);
          hexF(x, hx - 2 * S, hy - 26 * S, 6 * S, 0, "#fff7d6", 0.2);
          addGlow(
            x,
            hx,
            hy - 24 * S,
            70 * S,
            "#ffd76a",
            0.4 + 0.06 * Math.sin(t * 9),
          );
          // lantern beam toward the void
          x.save();
          x.globalCompositeOperation = "lighter";
          const bg = x.createLinearGradient(hx, hy, vx, vy);
          bg.addColorStop(0, "rgba(255,215,106,.18)");
          bg.addColorStop(1, "rgba(255,215,106,0)");
          x.fillStyle = bg;
          x.beginPath();
          x.moveTo(hx, hy - 24 * S);
          const bx = vx - hx,
            by = vy - (hy - 24 * S),
            bl = Math.hypot(bx, by),
            nx = -by / bl,
            ny = bx / bl;
          x.lineTo(vx + nx * 70 * S, vy + ny * 70 * S);
          x.lineTo(vx - nx * 70 * S, vy - ny * 70 * S);
          x.closePath();
          x.fill();
          x.restore();
          // vignette
          const v = x.createRadialGradient(
            W / 2,
            H / 2,
            Math.min(W, H) * 0.35,
            W / 2,
            H / 2,
            Math.max(W, H) * 0.8,
          );
          v.addColorStop(0, "rgba(4,5,25,0)");
          v.addColorStop(1, "rgba(4,5,25,.55)");
          x.fillStyle = v;
          x.fillRect(0, 0, W, H);
          if (!RM) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
